name: Secret MATCHPOINT sul gestionale NUOVO (solo cudi — voce 178)

# 🔌⭐⭐ PERCHÉ ESISTE — voce 178, «il passo zero del distacco».
#
# La voce dice cosa la chiude, e non è una modifica al codice: *«togliere i secret MATCHPOINT_*
# dal gestionale nuovo e vedere una prenotazione nascere senza avere la chiave. Finché i secret
# ci sono, "non abbiamo chiamato Matchpoint" è una promessa; tolti, è un fatto.»*
#
# 🔒🔒 SOLO IL GESTIONALE NUOVO, ED È CABLATO — non è una guardia che si può sbagliare, è un
#      valore che nel file non c'è: il ref di PROD (`qqbf…`) non compare da nessuna parte qui
#      dentro, e il progetto non è un input. ⇒ Questo attrezzo non PUÒ toccare PROD.
#      🗣️ Regola del committente, 09/09/2026: *«Supabase devi utilizzare solo test»*.
#
# 🚨⭐⭐ È UNA PORTA A SENSO UNICO, e va saputo prima di girarla: `supabase secrets list`
#      restituisce i NOMI e le IMPRONTE, mai i VALORI. ⇒ Chi toglie questi secret NON può
#      rimetterli da qui: per rimetterli servono le credenziali Matchpoint vere, che stanno
#      dal committente (e su PROD, che questo file non tocca).
#      📌 *Un attrezzo che disfa ciò che non sa rifare deve dirlo sulla propria faccia, non
#      nella scheda di chi lo lancia.*
#
# ⚖️ E NON È UN GUASTO CHE SI PROVOCA: è lo STATO FINALE voluto. Il disegno dell'08/09 («il
#    gestionale di TEST diventa il vero») dice che `cudi` non deve più parlare con Matchpoint.
#    Togliere le chiavi non rompe qualcosa che dovrà tornare: chiude una strada che deve restare
#    chiusa.
#
# 📏 COSA SMETTE DI FUNZIONARE, misurato sui log di `cudi` il 09/09 (24 ore):
#    · `matchpoint-queue-status` — **116 chiamate**, è il semaforo che il calendario interroga.
#      Non ha recinto: legge la chiave e basta ⇒ risponderà `500 WORKER_NOT_CONFIGURED`, e si
#      VEDE nell'app di TEST. Dopo il distacco è la risposta giusta: non c'è nessun worker di cui
#      riferire.
#    · `bookings-create` · `cancel` · `edit` (7 · 5 · 4 chiamate) — **non cambiano**: la cura
#      della 178 ha messo il recinto PRIMA del controllo della configurazione (create: recinto
#      alla riga 804, rifiuto per config alla 833) ⇒ si prenota per la strada nativa e il punto
#      dove manca la chiave non si raggiunge mai.
#    · i SYNC (bookings · clients · payments · history · wallet) — **zero chiamate**: su `cudi`
#      non li sveglia nessun cron, il calendario è congelato per scelta dal 14/08.

on:
  workflow_dispatch:
    inputs:
      azione:
        description: 'Cosa fare'
        required: true
        default: elenca
        type: choice
        options:
          - elenca
          - togli
      conferma:
        description: '🚨 Solo per «togli»: scrivere STACCO. Non si potranno rimettere da qui'
        required: false
        default: ''

jobs:
  secret:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # 🔒 Cablato. Il ref di PROD non compare in questo file, e il progetto non è un input.
      REF_TEST: cudiqnrrlbyqryrtaprd
    steps:
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: 🔎 Cosa c'è adesso (nomi e impronte — mai i valori)
        run: |
          set -euo pipefail
          echo "progetto: $REF_TEST  (cablato: PROD non è raggiungibile da questo file)"
          supabase secrets list --project-ref "$REF_TEST" | tee /tmp/prima.txt
          echo
          echo "── quelli che «togli» rimuoverebbe ──"
          grep -oE '^ *MATCHPOINT_[A-Z_]+' /tmp/prima.txt | tr -d ' ' | sort | tee /tmp/nomi.txt
          echo "totale: $(wc -l < /tmp/nomi.txt)"

      - name: 🚦 Il cancello — prima di togliere qualunque cosa
        if: ${{ inputs.azione == 'togli' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.conferma }}" != "STACCO" ]; then
            echo "::error::Togliere questi secret e' una porta a senso unico: i valori non si possono rileggere, quindi da qui non si rimettono. Per procedere va scritto STACCO nella casella di conferma."
            exit 1
          fi
          if [ ! -s /tmp/nomi.txt ]; then
            echo "::notice::Non c'e' nessun MATCHPOINT_* da togliere: gia' fatto."
            exit 0
          fi
          echo "::warning::Si tolgono $(wc -l < /tmp/nomi.txt) secret da $REF_TEST. Non si rimettono da qui."

      - name: 🔌 Togli i secret MATCHPOINT_* — solo dal gestionale nuovo
        if: ${{ inputs.azione == 'togli' && inputs.conferma == 'STACCO' }}
        run: |
          set -euo pipefail
          [ -s /tmp/nomi.txt ] || { echo "niente da togliere"; exit 0; }
          # ⭐ Uno alla volta e dichiarando il nome: un `unset` in blocco che fallisce a meta'
          # lascerebbe uno stato che nessuno sa leggere dal registro.
          while read -r NOME; do
            [ -n "$NOME" ] || continue
            echo "── tolgo $NOME"
            supabase secrets unset "$NOME" --project-ref "$REF_TEST"
          done < /tmp/nomi.txt

      - name: 📏 Com'è rimasto — si RILEGGE, non si suppone
        if: ${{ inputs.azione == 'togli' && inputs.conferma == 'STACCO' }}
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$REF_TEST" | tee /tmp/dopo.txt
          RIMASTI="$(grep -cE '^ *MATCHPOINT_[A-Z_]+' /tmp/dopo.txt || true)"
          echo "── MATCHPOINT_* rimasti: $RIMASTI ──"
          if [ "$RIMASTI" != "0" ]; then
            echo "::error::Ne restano $RIMASTI: il distacco non e' completo, e dirlo fatto sarebbe peggio che non averlo fatto."
            exit 1
          fi
          echo "::notice::Zero MATCHPOINT_* sul gestionale nuovo. Adesso «non chiamiamo Matchpoint» e' un fatto, non una promessa."
