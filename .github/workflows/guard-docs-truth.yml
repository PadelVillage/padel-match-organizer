name: Guard verità docs (dichiarato vs misurato)

# L'ALTRA METÀ della voce 30. `guard-worker-sync.yml` verifica che i documenti siano UGUALI
# sui due rami; questo verifica che dicano il VERO. Sono complementari e nessuno dei due
# sostituisce l'altro:
#
#   · due registri identici e sbagliati passano il guard di parità — verdi, e mentono;
#   · un registro giusto su un ramo solo passa questo — vero, e non protegge l'altro ramo.
#
# I due guasti veri che l'hanno motivato, misurati il 13/08/2026:
#
#  1. VERSIONI DICHIARATE. `docs/stato-progetto-corrente.md` si intitola «fonte rapida
#     ufficiale» e si impegna, in testa a sé stesso, a «dichiarare quale versione TEST/PROD
#     risulta corrente». Per tre mesi ha dichiarato v5.527 mentre PROD stava a 6.216: 689
#     versioni indietro, e chiedeva di credergli CONTRO i prompt. Curato la mattina del 13/08
#     (#674) — e la sera stessa dichiarava già 6.216/6.217 contro 6.219/6.222 reali. Un
#     documento che si dichiara autorevole e non è verificato è peggio di nessun documento.
#
#  2. CONTEGGI. In `docs/lavori/README.md` la sezione C dichiarava 11 voci contenendone 12,
#     la D ne dichiarava 5 contenendone 4. I due errori si ANNULLAVANO: il totale 16 tornava
#     e nessuno se n'era accorto. Per questo ogni numero è verificato per conto suo e non
#     solo la somma — è precisamente il caso che una verifica sul totale lascia passare.
#
#  3. LE CHIUSE ERANO SCOPERTE (aggiunte il 13/08, dopo i primi run). Il controllo nacque
#     sulle liste vive — urgenti e in coda — e lasciava fuori l'unica lista che CRESCE a
#     ogni sessione. Quel giorno tornava, 7 dichiarate e 7 righe, ma per diligenza: nessuno
#     la contava. Ed è esattamente la condizione da cui è partita la sezione C, che di
#     diligenza ne ha avuta altrettanta e ha mentito lo stesso per mesi.
#
# ⚖️ COSA NON CONTROLLA, DI PROPOSITO:
#
#   · gli SHA citati nei documenti. Un file che cita il proprio sha è vecchio nell'istante in
#     cui viene salvato, e riallinearlo ne aggiunge un altro: inseguirlo non converge. Un
#     controllo del genere sarebbe rosso per sempre, e una guardia sempre rossa si ignora.
#   · il numero di PR aperte, per lo stesso motivo: cambia di minuto in minuto.
#   · le versioni dichiarate in `docs/lavori/README.md`. Quello è una FOTOGRAFIA datata, che
#     dichiara da sé cosa ha misurato e quando: essere «di ieri» non è mentire. Il suo scarto
#     viene però SEMPRE stampato come avviso, così è visibile senza bloccare nulla.
#   · i conteggi STORICI delle chiuse — `~56 dal 7/08`, `~41 fino al 6/08`. Portano la tilde
#     davanti e le voci non stanno più nel file: sono incontabili per costruzione, e un numero
#     che si dichiara approssimato non promette niente da verificare. Della riga «Chiuse» si
#     controlla quindi SOLO il primo numero, quello del blocco datato che le righe ce le ha.
#
# La differenza è netta: si controlla ciò che un documento promette di sé. `stato-progetto-corrente`
# promette di essere corrente ⇒ deve esserlo. `lavori/README` promette di essere una fotografia
# datata ⇒ deve solo essere internamente coerente.

on:
  push:
    branches: [main, test-preview]
    paths:
      - 'docs/**'
      - 'index.html'
      - '.github/workflows/guard-docs-truth.yml'
  schedule:
    - cron: '30 6 * * *'   # backstop giornaliero, mezz'ora dopo guard-worker-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioni-dichiarate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Le versioni dichiarate nei registri devono essere quelle VERE
        run: |
          set -euo pipefail
          git fetch -q origin main test-preview

          # 🔎 QUALE COPIA SI GIUDICA — e perché non è più `origin/main` comunque sia andata.
          # *(05/09/2026, 89ª sessione.)* Fino a stasera il DICHIARATO si leggeva sempre da
          # `origin/main`, mentre il REALE si leggeva dai due rami. Nella finestra del 4bis —
          # fra la spinta su `test-preview` e il merge su `main` — le due letture parlano di
          # due istanti diversi, e la guardia diventa ROSSA PER COSTRUZIONE. Non è una
          # possibilità: è successo stasera (run 1128: «dichiara TEST v6.368, ma test-preview
          # gira a 6.370»), ed era la terza sessione che se lo riprometteva.
          # 📏 MISURATE 9 promozioni fra il 04 e il 05/09: lo scarto fra il momento in cui
          # `test-preview` dichiara la nuova PROD e il momento in cui `main` la gira davvero
          # va da **-256 s a +120 s**, in tutt'e due i versi. Non è un caso raro da tollerare:
          # è la forma normale di ogni promozione.
          # ⇒ Si giudica la copia CHE È STATA SPINTA (il ref che ha acceso il run), e su un
          # push si controlla la RIGA DEL RAMO CHE SI È MOSSO: un push su `test-preview` non
          # può essere giudicato sullo stato in volo di `main`, né viceversa.
          # ⚖️ Cosa NON si perde: le due righe si controllano INSIEME sul backstop giornaliero
          # e su ogni lancio a mano, cioè quando non c'è niente in volo. La malattia del 13/08
          # — 689 versioni di scarto per tre mesi — non dura due minuti, dura mesi: resta presa
          # dal backstop il mattino dopo, e dal push del ramo che mente appena si muove.
          # 🚨 La differenza fra le due guardie sta qui: `guard-worker-sync` confronta i due
          # rami FRA LORO (e per quello la pazienza di 90 s basta), questa confronta un
          # documento con un fatto — e nella finestra il fatto è diverso sui due rami.
          REF="${GITHUB_REF_NAME}"
          EVT="${GITHUB_EVENT_NAME}"
          DOC='docs/stato-progetto-corrente.md'

          # La misura: APP_VERSION nel codice che gira davvero su ciascun ramo.
          ver_of() {
            git show "$1:index.html" \
              | grep -m1 -oE "APP_VERSION *= *'[0-9]+\.[0-9]+'" \
              | grep -oE "[0-9]+\.[0-9]+" | head -1
          }
          # La dichiarazione: la tabella «Versione corrente» del registro, nella copia spinta.
          # Righe della forma:  | PROD | **v6.219** | `main` | ...
          decl_of() {
            git show "origin/$REF:$DOC" \
              | grep -m1 -E "^\| *$1 *\|" \
              | grep -oE "v[0-9]+\.[0-9]+" | head -1 | tr -d 'v'
          }

          case "$EVT:$REF" in
            push:main)         RIGHE='PROD' ;;
            push:test-preview) RIGHE='TEST' ;;
            *)                 RIGHE='PROD TEST' ;;   # backstop e lanci a mano: tutt'e due
          esac

          controlla() {
            fail=0
            PROD_REAL="$(ver_of origin/main || true)"
            TEST_REAL="$(ver_of origin/test-preview || true)"
            # Meglio fallire che dare un verde che non ha controllato nulla.
            if [ -z "$PROD_REAL" ] || [ -z "$TEST_REAL" ]; then
              echo "::error::APP_VERSION non trovata in index.html (main='$PROD_REAL' test='$TEST_REAL')."
              echo "È cambiata la forma della riga? Il guard non sa più dove guardare."
              exit 1
            fi
            echo "  copia giudicata: origin/$REF   (evento: $EVT ⇒ righe controllate: $RIGHE)"
            echo ""
            echo "                 dichiarato   reale"
            for riga in PROD TEST; do
              if [ "$riga" = PROD ]; then real="$PROD_REAL"; else real="$TEST_REAL"; fi
              decl="$(decl_of "$riga" || true)"
              if [ -z "$decl" ]; then
                echo "::error::Versione dichiarata per $riga non trovata in origin/$REF:$DOC."
                echo "È cambiata la forma della tabella «Versione corrente»? Il guard non sa più dove"
                echo "guardare; un verde qui significherebbe 'non ho controllato', non 'va tutto bene'."
                exit 1
              fi
              case " $RIGHE " in
                *" $riga "*)
                  printf '  %-14s %-12s %s\n' "$riga" "$decl" "$real"
                  if [ "$decl" != "$real" ]; then
                    echo "::error::$DOC dichiara $riga v$decl, ma il suo ramo gira a $real."
                    fail=1
                  fi
                  ;;
                *)
                  printf '  %-14s %-12s %-9s ← non controllata: si è mosso solo %s\n' \
                         "$riga" "$decl" "$real" "$REF"
                  ;;
              esac
            done
            return $fail
          }

          if ! controlla; then
            echo ""
            echo "⏳ Non fallisco subito: aspetto 90 secondi e rileggo i ref."
            echo "   Un registro spinto un attimo prima (o dopo) del numero di versione è una"
            echo "   finestra di transizione, non una bugia. È la stessa pazienza che"
            echo "   guard-worker-sync ha dal 14/08, e per la stessa ragione: una guardia che"
            echo "   ogni tanto ha torto è una guardia che si smette di leggere."
            sleep 90
            git fetch -q origin main test-preview
            echo ""
            if ! controlla; then
              echo ""
              echo "RIMEDIO: aggiorna la tabella «Versione corrente» in $DOC ai valori reali."
              echo "Quel file si impegna in testa a sé stesso a dichiarare la versione corrente:"
              echo "se non lo fa, non è un documento vecchio, è un documento che mente — ed è"
              echo "la malattia curata il 13/08 (689 versioni di scarto, per tre mesi)."
              exit 1
            fi
            echo "…rientrato alla seconda lettura: era la finestra di transizione."
          fi

          # La fotografia dei lavori: scarto segnalato, mai bloccante (è datata per natura).
          LAV='docs/lavori/README.md'
          LAV_PROD="$(git show "origin/$REF:$LAV" | grep -m1 -oE 'app PROD \*\*[0-9]+\.[0-9]+\*\*' | grep -oE '[0-9]+\.[0-9]+' || true)"
          LAV_TEST="$(git show "origin/$REF:$LAV" | grep -m1 -oE 'TEST \*\*[0-9]+\.[0-9]+\*\*' | grep -oE '[0-9]+\.[0-9]+' || true)"
          if [ -n "$LAV_PROD" ] && { [ "$LAV_PROD" != "$PROD_REAL" ] || [ "$LAV_TEST" != "$TEST_REAL" ]; }; then
            echo "::warning::La fotografia in $LAV dichiara PROD $LAV_PROD / TEST $LAV_TEST, oggi sono $PROD_REAL / $TEST_REAL."
            echo "Non è un errore: quella è una fotografia datata. Ma se lo scarto cresce, la prossima sessione parte con un'idea vecchia del sistema."
          fi

          echo "✅ I registri dichiarano le versioni vere."

  conteggi-lavori:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: I conteggi di docs/lavori/README.md devono corrispondere alle voci contate
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          git fetch -q origin "$REF"

          # Basta controllare UNA copia: guard-worker-sync garantisce che docs/ sia
          # identico sui due rami. Se quella guardia sparisse, questo controllo
          # coprirebbe solo il ramo spinto — sono legate, e vanno tolte insieme o mai.
          # 🚨 Ma la copia giusta è QUELLA SPINTA, non sempre `main`. *(05/09/2026)* Prima si
          # leggeva `origin/main` comunque: un conteggio sbagliato spinto su `test-preview`
          # passava VERDE — la guardia controllava un file che non era quello appena scritto,
          # e diceva «i conti tornano» intendendo «ho letto un altro documento».
          F='docs/lavori/README.md'
          git show "origin/$REF:$F" > /tmp/lavori.md
          echo "  copia giudicata: origin/$REF"

          # --- ciò che il file DICHIARA ---
          URG_H=$(grep -m1 -oE '^## .*URGENTI — [0-9]+' /tmp/lavori.md | grep -oE '[0-9]+$' || true)
          CODA_H=$(grep -m1 -oE '^## .*IN CODA — [0-9]+' /tmp/lavori.md | grep -oE '[0-9]+$' || true)
          C_H=$(grep -m1 -oE '^### C —.*— [0-9]+' /tmp/lavori.md | grep -oE '[0-9]+$' || true)
          D_H=$(grep -m1 -oE '^### D —.*— [0-9]+' /tmp/lavori.md | grep -oE '[0-9]+$' || true)
          URG_T=$(grep -m1 -E '^\|.*Urgenti\*\* *\| *\*\*[0-9]+\*\*' /tmp/lavori.md | grep -oE '[0-9]+' | head -1 || true)
          CODA_T=$(grep -m1 -E '^\|.*In coda\*\* *\| *\*\*[0-9]+\*\*' /tmp/lavori.md | grep -oE '[0-9]+' | head -1 || true)
          # Titolo:  ## 📦 CHIUSE — 13/08/2026 — 7 voci   → la data ha cifre, quindi si àncora a «voci».
          # Tabella: | 📦 **Chiuse** | **7** il 13/08 + ~56 dal 7/08 + ... → si prende il primo **N**,
          # non la prima cifra: quella riga di numeri ne ha sei, e cinque non sono il conteggio.
          CHIU_H=$(grep -m1 -oE '^## .*CHIUSE —.*— [0-9]+ voci' /tmp/lavori.md | grep -oE '[0-9]+ voci' | grep -oE '[0-9]+' || true)
          CHIU_T=$(grep -m1 -E '^\|.*Chiuse\*\* *\| *\*\*[0-9]+\*\*' /tmp/lavori.md | grep -oE '\*\*[0-9]+\*\*' | head -1 | tr -d '*' || true)

          for v in URG_H CODA_H C_H D_H URG_T CODA_T CHIU_H CHIU_T; do
            if [ -z "$(eval echo \$$v)" ]; then
              echo "::error::Non ho trovato il numero dichiarato per '$v' in $F."
              echo "È cambiata la forma delle intestazioni o della tabella riassuntiva?"
              echo "Meglio fallire che dare un verde che non ha controllato nulla."
              exit 1
            fi
          done

          # --- ciò che il file CONTIENE ---
          URG_N=$(awk '/^## .*URGENTI —/{f=1;next} /^## .*IN CODA —/{f=0} f && /^### /{c++} END{print c+0}' /tmp/lavori.md)
          # Una voce VIVA di C o di D è una riga di tabella il cui numero sta da solo nella
          # prima cella: `| **68** | ...`. Il `\|` subito dopo le due stelle è ciò che la
          # distingue dalle tabelle STORICHE della stessa sezione, dove il numero è seguito
          # dal titolo nella stessa cella (`| **52** Autovalutazione morta | 📦 CHIUSA…`):
          # quelle raccontano dove una voce è finita, non sono voci in coda.
          # 🚨 Qui prima si contavano i titoli `#### ` — uno stile che la sezione C NON usa.
          # Finché C è stata VUOTA il controllo passava (0 dichiarato, 0 contato) e sembrava
          # funzionante; è diventato rosso alla prima voce entrata davvero, e ci è rimasto.
          # ⇒ Una guardia che passa su una sezione vuota non ha ancora dimostrato di saperla
          # contare: il verde diceva «i conti tornano» e voleva dire «non c'è niente da contare».
          C_N=$(awk '/^### C —/{f=1;next} /^### D —/{f=0} f && /^\| \*\*[0-9]+\*\* \|/{c++} END{print c+0}' /tmp/lavori.md)
          D_N=$(awk '/^### D —/{f=1;next} /^## /{f=0} f && /^\| \*\*[0-9]+\*\* \|/{c++} END{print c+0}' /tmp/lavori.md)
          # Una riga-voce delle chiuse ha nella prima cella `—` (voce mai numerata) oppure
          # `**N**` (voce che aveva un numero in coda). Intestazione e separatore non hanno
          # quella forma ed escono da soli. Si chiude alla PRIMA riga che comincia per `#`,
          # non solo su `## `: dopo le chiuse viene `# 🧠 Memorie tematiche`, di primo livello.
          CHIU_N=$(awk '/^## .*CHIUSE —/{f=1;next} /^#/{f=0} f && /^\| (—|\*\*[0-9])/{c++} END{print c+0}' /tmp/lavori.md)

          echo "                        dichiarato   contato"
          printf '  🔴 urgenti (titolo)   %-12s %s\n' "$URG_H" "$URG_N"
          printf '  🔴 urgenti (tabella)  %-12s %s\n' "$URG_T" "$URG_N"
          printf '  📋 in coda (titolo)   %-12s %s\n' "$CODA_H" "$((C_N + D_N))"
          printf '  📋 in coda (tabella)  %-12s %s\n' "$CODA_T" "$((C_N + D_N))"
          printf '  C — sapute            %-12s %s\n' "$C_H" "$C_N"
          printf '  D — corpose           %-12s %s\n' "$D_H" "$D_N"
          printf '  📦 chiuse (titolo)    %-12s %s\n' "$CHIU_H" "$CHIU_N"
          printf '  📦 chiuse (tabella)   %-12s %s\n' "$CHIU_T" "$CHIU_N"
          echo ""

          FAIL=0
          chk() { # $1=etichetta $2=dichiarato $3=contato
            if [ "$2" != "$3" ]; then
              echo "::error::$1: il file dichiara $2, ne contiene $3."
              FAIL=1
            fi
          }
          chk "🔴 urgenti (titolo di sezione)"  "$URG_H"  "$URG_N"
          chk "🔴 urgenti (tabella in cima)"    "$URG_T"  "$URG_N"
          chk "C — cose sapute"                 "$C_H"    "$C_N"
          chk "D — corpose"                     "$D_H"    "$D_N"
          chk "📋 in coda (titolo di sezione)"  "$CODA_H" "$((C_N + D_N))"
          chk "📋 in coda (tabella in cima)"    "$CODA_T" "$((C_N + D_N))"
          chk "📦 chiuse (titolo di sezione)"   "$CHIU_H" "$CHIU_N"
          chk "📦 chiuse (tabella in cima)"     "$CHIU_T" "$CHIU_N"

          # 🚨 E una voce può esistere SENZA riga, cioè fuori dal conto di sopra. È successo:
          # la 142 e la 143 sono entrate il 04/09/2026 con la loro scheda `### N — …` in cima
          # alla sezione IN CODA e non hanno mai avuto una riga in tabella ⇒ la coda ne
          # dichiarava 17 e ne conteneva 19, e questa guardia restava VERDE per un giorno e
          # mezzo, perché contava le righe e una voce senza riga per lei non esiste.
          # ⇒ Ogni scheda numerata dentro IN CODA deve avere la sua riga in C o in D.
          # Le schede delle voci CHIUSE che restano lì per il ragionamento non hanno questa
          # forma (`## 🔓 VOCE 88 — …`), quindi non entrano: si cercano i soli `### N — `.
          SCHEDE=$(awk '/^## .*IN CODA —/{f=1;next} /^## .*CHIUSE —/{f=0} f && /^### [0-9]+ —/{print $2}' /tmp/lavori.md)
          for n in $SCHEDE; do
            if ! grep -qE "^\| \*\*$n\*\* \|" /tmp/lavori.md; then
              echo "::error::la voce $n ha una scheda dentro «IN CODA» ma nessuna riga in tabella: non la conta nessuno."
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Ogni numero è verificato PER CONTO SUO, non solo la somma: il 13/08 la"
            echo "sezione C ne dichiarava 11 con 12 voci e la D 5 con 4 righe, i due errori"
            echo "si annullavano e il totale tornava. Una verifica sul solo totale li avrebbe"
            echo "lasciati passare — come infatti è successo, per mesi."
            echo ""
            echo "RIMEDIO: correggi i numeri dichiarati in $F, oppure la voce che manca/avanza."
            exit 1
          fi
          echo "✅ Dichiarato e contato coincidono, numero per numero."
