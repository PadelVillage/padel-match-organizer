name: Secret MATCHPOINT del sistema nuovo (verifica · togli · rimetti)

# 🔌⭐⭐ PERCHÉ ESISTE — 08/09/2026, voce 178.
#
# La prova del distacco è una sola: **prenotare sul sistema nuovo senza avere la chiave per
# chiamare il worker**. Finché i secret `MATCHPOINT_*` ci sono, «non abbiamo chiamato Matchpoint»
# è una promessa; tolti, è un fatto.
#
# 🚨 MA I SECRET DI SUPABASE NON SI RILEGGONO. `supabase secrets list` mostra i NOMI e un digest,
# mai i valori. ⇒ Toglierli senza sapere come rimetterli è una porta a senso unico, e questo
# progetto le porte a senso unico le dichiara prima.
#
# ⭐ LA STRADA DEL RITORNO, ed è il motivo per cui questo attrezzo ha tre modi invece di uno:
# tutti e quattro i valori si recuperano SENZA leggerli da Supabase —
#   · `MATCHPOINT_BROWSER_WORKER_URL`     → è un INDIRIZZO documentato, non un segreto;
#   · `MATCHPOINT_BROWSER_WORKER_API_KEY` → pm2 sulla VM, dove il worker la chiama
#                                            `MATCHPOINT_WORKER_API_KEY` (nome diverso, stesso valore);
#   · `MATCHPOINT_USERNAME` · `MATCHPOINT_PASSWORD` → pm2 sulla VM.
# 📌 *Un gesto irreversibile diventa reversibile quando si sa da dove tornare — e quel «da dove»
# si verifica PRIMA, non quando serve.*
#
# ⛔ COSA QUESTO ATTREZZO NON PUÒ FARE, ed è cablato:
#   · il progetto è **solo `cudi…`** (il sistema nuovo). Il ref di PROD non compare in questo file:
#     non è una guardia che si può sbagliare, è un valore che non c'è;
#   · i **nomi** dei secret sono scritti qui, non arrivano da un input ⇒ non può toccare un secret
#     qualunque. È la stessa forma di `interruttore-arricchimento-schede.yml`;
#   · **non stampa mai un valore**: solo ✅/❌, la lunghezza e le prime 8 cifre di uno sha256.
#     Quel prefisso serve a confrontare «prima» e «dopo» senza rivelare niente.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'verifica (sola lettura) · togli · rimetti'
        required: true
        default: verifica
        type: choice
        options: [verifica, togli, rimetti]
      conferma:
        description: 'Per togli/rimetti va scritta la parola TOGLI o RIMETTI'
        required: false
        default: ''

jobs:
  secret:
    runs-on: ubuntu-latest
    env:
      # 🔒 Solo il sistema nuovo. Il ref di PROD non sta in questo file, di proposito.
      REF_NUOVO: cudiqnrrlbyqryrtaprd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEPLOY_HOST: ${{ vars.HETZNER_WORKER_HOST || '91.99.131.243' }}
      DEPLOY_USER: ${{ vars.HETZNER_WORKER_USER || 'root' }}
      MODO: ${{ inputs.modo }}
      CONFERMA: ${{ inputs.conferma }}
    steps:
      - name: Controlla la parola di conferma
        run: |
          set -euo pipefail
          case "$MODO" in
            verifica) echo "::notice::Sola lettura: non tocco niente." ;;
            togli)
              [ "$CONFERMA" = "TOGLI" ] || { echo "::error::Per togliere va scritta la parola TOGLI."; exit 1; } ;;
            rimetti)
              [ "$CONFERMA" = "RIMETTI" ] || { echo "::error::Per rimettere va scritta la parola RIMETTI."; exit 1; } ;;
            *) echo "::error::modo sconosciuto: $MODO"; exit 1 ;;
          esac

      - name: Prepara SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📋 Cosa c'è ADESSO sul sistema nuovo
        # 🩹 Sta PRIMA della strada del ritorno, e non è cosmetica: al giro #2 dell'08/09 il
        #    passo del ritorno usciva 1 e questo non girava mai ⇒ non si sapeva nemmeno QUALI
        #    dei quattro secret esistono su `cudi`. 📌 *Una sonda che non gira quando l'altra
        #    fallisce non è una sonda: è un premio per il caso fortunato.*
        run: |
          set -euo pipefail
          echo "::group::secret MATCHPOINT_* su $REF_NUOVO"
          npx supabase@latest secrets list --project-ref "$REF_NUOVO" \
            | grep -E 'NAME|MATCHPOINT_' || echo '(nessun MATCHPOINT_* trovato)'
          echo "::endgroup::"

      - name: 🔙 LA STRADA DEL RITORNO — i valori si recuperano dalla VM?
        id: ritorno
        run: |
          set -euo pipefail
          # ⛔ I valori restano in variabili e finiscono in GITHUB_OUTPUT come `add-mask`ati.
          #    Non si stampano MAI: si stampa solo se ci sono, DA DOVE, quanto sono lunghi e
          #    uno sha corto. Quel prefisso confronta «prima» e «dopo» senza rivelare niente.
          # 🩹⭐⭐ TRE FONTI, non una — misurato l'08/09 sera. I due giri precedenti guardavano
          #    solo `pm2_env`, e il secondo (con il PATH corretto) ha dato tre ❌ credibili.
          #    Ma «non sta in pm2» non è «non sta sulla VM»: il worker legge `process.env`, e
          #    quell'ambiente può arrivare da un `.env` letto all'avvio o da un wrapper. L'unica
          #    fonte che non mente è /proc/<pid>/environ del processo VIVO.
          #    📌 *Una sonda che interroga UNA fonte risponde su quella fonte, non sul fatto.*
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s > /tmp/raccolto.txt <<'REMOTO' || true
            export PATH="/opt/node24/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            echo "### FONTE pm2"
            if command -v pm2 >/dev/null 2>&1; then pm2 jlist 2>/dev/null; else echo "PM2_ASSENTE"; fi
            echo "### FONTE envfile"
            if [ -f /opt/matchpoint-worker/.env ]; then cat /opt/matchpoint-worker/.env; else echo "ENVFILE_ASSENTE"; fi
            echo "### FONTE proc"
            PID="$(pgrep -f 'matchpoint-worker/src/server.mjs' | head -1)"
            if [ -z "$PID" ]; then
              PID="$(ss -ltnp 2>/dev/null | grep ':8787' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)"
            fi
            if [ -n "$PID" ] && [ -r "/proc/$PID/environ" ]; then
              echo "PID_TROVATO=$PID"
              tr '\0' '\n' < "/proc/$PID/environ"
            else
              echo "PROC_NON_LEGGIBILE"
            fi
            echo "### FINE"
          REMOTO

          python3 - <<'PY' > /tmp/valori.txt
          import json, os, re, sys

          testo = open('/tmp/raccolto.txt', errors='replace').read()
          pezzi = {}
          for nome in ('pm2', 'envfile', 'proc'):
              m = re.search(r'### FONTE ' + nome + r'\n(.*?)(?=\n### )', testo, re.S)
              pezzi[nome] = m.group(1) if m else ''

          def da_pm2(t):
              i, j = t.find('['), t.rfind(']')
              if i < 0 or j <= i:
                  return {}, 'pm2 non ha risposto JSON'
              try:
                  d = json.loads(t[i:j + 1])
              except Exception as e:
                  return {}, 'pm2 JSON illeggibile (%s)' % type(e).__name__
              nomi = ', '.join(p.get('name', '?') for p in d)
              e = next(((p.get('pm2_env') or {}) for p in d if p.get('name') == 'matchpoint-worker'), None)
              if e is None:
                  return {}, 'pm2: %d processi (%s) — matchpoint-worker NON c\'e' % (len(d), nomi)
              return e, 'pm2: %d processi (%s) — pm2_env letto, %d chiavi' % (len(d), nomi, len(e))

          def da_righe(t):
              out = {}
              for r in t.splitlines():
                  r = r.strip()
                  if not r or r.startswith('#') or '=' not in r:
                      continue
                  k, v = r.split('=', 1)
                  out[k.strip()] = v.strip().strip('"').strip("'")
              return out

          fonti = []
          env_pm2, nota = da_pm2(pezzi['pm2']);            fonti.append(('pm2', env_pm2, nota))
          e = da_righe(pezzi['envfile'])
          fonti.append(('envfile', e,
                        'envfile: ASSENTE' if 'ENVFILE_ASSENTE' in pezzi['envfile']
                        else 'envfile: %d chiavi' % len(e)))
          p = da_righe(pezzi['proc'])
          fonti.append(('proc', p,
                        'proc: NON leggibile' if 'PROC_NON_LEGGIBILE' in pezzi['proc']
                        else 'proc: pid %s, %d variabili' % (p.get('PID_TROVATO', '?'), len(p))))

          for _, _, nota in fonti:
              print('NOTA\t' + nota, file=sys.stderr)

          for chiave in ('MATCHPOINT_USERNAME', 'MATCHPOINT_PASSWORD', 'MATCHPOINT_WORKER_API_KEY'):
              trovato = ''
              fonte = ''
              for nome, mappa, _ in fonti:
                  v = str(mappa.get(chiave) or '')
                  if v:
                      trovato, fonte = v, nome
                      break
              print('%s\t%s\t%s' % (chiave, fonte or '-', trovato))
          PY

          campo () { awk -F'\t' -v k="$1" -v c="$2" '$1==k{print $c; exit}' /tmp/valori.txt; }
          MP_USER="$(campo MATCHPOINT_USERNAME 3)"
          MP_PASS="$(campo MATCHPOINT_PASSWORD 3)"
          MP_KEY="$(campo MATCHPOINT_WORKER_API_KEY 3)"
          F_USER="$(campo MATCHPOINT_USERNAME 2)"
          F_PASS="$(campo MATCHPOINT_PASSWORD 2)"
          F_KEY="$(campo MATCHPOINT_WORKER_API_KEY 2)"
          # L'indirizzo NON è un segreto: è documentato in CLAUDE.md e nei docs.
          MP_URL='https://worker.91.99.131.243.nip.io'

          for v in MP_USER MP_PASS MP_KEY; do
            [ -n "${!v}" ] && echo "::add-mask::${!v}"
          done

          echo "┌─ la strada del ritorno ────────────────────────────────"
          MANCA=0
          riga () { # $1=etichetta $2=valore $3=fonte
            if [ -n "$2" ]; then
              printf '│ ✅ %-34s %2d caratteri · sha %s · da %s\n' \
                "$1" "${#2}" "$(printf '%s' "$2" | sha256sum | cut -c1-8)" "$3"
            else
              printf '│ ❌ %-34s NON recuperabile da nessuna delle tre fonti\n' "$1"; MANCA=1
            fi
          }
          riga 'MATCHPOINT_USERNAME'                 "$MP_USER" "$F_USER"
          riga 'MATCHPOINT_PASSWORD'                 "$MP_PASS" "$F_PASS"
          riga 'MATCHPOINT_BROWSER_WORKER_API_KEY'   "$MP_KEY"  "$F_KEY"
          riga 'MATCHPOINT_BROWSER_WORKER_URL'       "$MP_URL"  'noto'
          echo "└────────────────────────────────────────────────────────"

          if [ "$MANCA" -ne 0 ]; then
            if [ "$MODO" = "verifica" ]; then
              # 🩹 In sola lettura un ❌ è un RISULTATO, non un guasto: far uscire rossa una
              #    sonda che ha fatto il suo mestiere è il modo di smettere di leggerla.
              echo '::warning::Almeno un valore non si recupera dalla VM. È la misura, non un errore: il modo togli resta bloccato.'
            else
              echo "::error::Almeno un valore NON si recupera dalla VM: togliere i secret sarebbe una porta a senso unico. Mi fermo."
              exit 1
            fi
          else
            echo "::notice::Tutti e quattro i valori si recuperano: il ritorno c'è."
          fi

          {
            echo "mp_user<<EOF"; echo "$MP_USER"; echo "EOF"
            echo "mp_pass<<EOF"; echo "$MP_PASS"; echo "EOF"
            echo "mp_key<<EOF";  echo "$MP_KEY";  echo "EOF"
            echo "mp_url=$MP_URL"
          } >> "$GITHUB_OUTPUT"

      - name: 🔌 TOGLI i quattro secret
        if: ${{ inputs.modo == 'togli' }}
        run: |
          set -euo pipefail
          # 🔒 I nomi sono scritti QUI: non arrivano da un input.
          npx supabase@latest secrets unset \
            MATCHPOINT_BROWSER_WORKER_URL \
            MATCHPOINT_BROWSER_WORKER_API_KEY \
            MATCHPOINT_USERNAME \
            MATCHPOINT_PASSWORD \
            --project-ref "$REF_NUOVO"

      - name: ↩︎ RIMETTI i quattro secret (dai valori recuperati dalla VM)
        if: ${{ inputs.modo == 'rimetti' }}
        run: |
          set -euo pipefail
          npx supabase@latest secrets set \
            "MATCHPOINT_BROWSER_WORKER_URL=${{ steps.ritorno.outputs.mp_url }}" \
            "MATCHPOINT_BROWSER_WORKER_API_KEY=${{ steps.ritorno.outputs.mp_key }}" \
            "MATCHPOINT_USERNAME=${{ steps.ritorno.outputs.mp_user }}" \
            "MATCHPOINT_PASSWORD=${{ steps.ritorno.outputs.mp_pass }}" \
            --project-ref "$REF_NUOVO"

      - name: 🔎 RILEGGI, e controlla che sia successo davvero
        if: ${{ inputs.modo != 'verifica' }}
        run: |
          set -euo pipefail
          # 🚨 Non basta che il comando sia uscito 0: si guarda lo STATO, come fa
          #    `interruttore-arricchimento-schede.yml`. Un comando che parte non è un fatto.
          npx supabase@latest secrets list --project-ref "$REF_NUOVO" > /tmp/dopo.txt
          RIMASTI="$(grep -cE '^ *MATCHPOINT_(BROWSER_WORKER_URL|BROWSER_WORKER_API_KEY|USERNAME|PASSWORD) ' /tmp/dopo.txt || true)"
          echo "::group::stato dopo"
          grep -E 'NAME|MATCHPOINT_' /tmp/dopo.txt || echo '(nessun MATCHPOINT_*)'
          echo "::endgroup::"

          if [ "$MODO" = "togli" ]; then
            [ "$RIMASTI" = "0" ] || { echo "::error::ne restano $RIMASTI dei quattro: il comando è partito ma non è arrivato."; exit 1; }
            echo "::notice::I quattro secret NON ci sono più su $REF_NUOVO. Il ritorno è «rimetti»."
          else
            [ "$RIMASTI" = "4" ] || { echo "::error::ne risultano $RIMASTI su 4: rimessi a metà."; exit 1; }
            echo "::notice::I quattro secret sono tornati su $REF_NUOVO."
          fi
