name: Cosa c'è nella FICHA di una partita Matchpoint (sola lettura)

# ⭐ PERCHÉ ESISTE — 01/09/2026 notte, voce 117.
#
# 📏 Il registro del worker ha dato la causa dei due fallimenti del 01/09, e NON è quella che
# la scheda supponeva («un solo tentativo, 8 s, nessun retry»). Il call log di Playwright dice
# per esteso perché il click non passa:
#
#     <div id="mpModalDevolucionCapa">…</div> intercepts pointer events
#
# ⇒ Il link «Eliminare» porta `onclick="return confirmarEliminarParticipanteConDevolucion(this)"`:
# il PRIMO click **apre un modale di Matchpoint** (una conferma di RIMBORSO) e restituisce false,
# quindi il postback non parte. Il worker non sa che quel modale esista: aspetta 1,2 s, ri-scansiona,
# trova la persona ancora lì e **ri-clicca** — e il secondo click cade sul modale aperto, che
# intercetta il puntatore. Gli 8 s scadono lì.
#
# ⛔ QUELLO CHE QUESTA SONDA NON FA: **non clicca niente**. Il modale si legge dal DOM dov'è già,
# nascosto. Cliccare «Eliminare» per vederlo aprire sarebbe un gesto sul Matchpoint VERO, e se
# il modale non comparisse partirebbe il postback: un giocatore tolto per davvero da una sonda
# di lettura. La domanda si può fare senza correre quel rischio, quindi si fa senza.
#
# 🚨 E il pezzo che questa sonda serve a decidere NON È TECNICO: il modale si chiama «Devolución»
# (rimborso). Quale dei suoi bottoni sia quello giusto è una scelta sui SOLDI del socio, e la
# prende il committente — non si indovina leggendo il codice.
#
# ⚠️ Apre un secondo Chromium sulla VM per il tempo della lettura, con un login Matchpoint suo.
# Non tocca la coda del worker e non passa dai suoi endpoint.

on:
  workflow_dispatch:
    inputs:
      id_partita:
        description: 'id della ficha (il numero dopo ?id= — es. 9754)'
        required: true

jobs:
  leggi:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.HETZNER_WORKER_HOST || '91.99.131.243' }}
      DEPLOY_USER: ${{ vars.HETZNER_WORKER_USER || 'root' }}
      DEPLOY_PATH: ${{ vars.HETZNER_WORKER_PATH || '/opt/matchpoint-worker' }}
      ID_PARTITA: ${{ inputs.id_partita }}
    steps:
      - name: Valida l'input
        run: |
          set -euo pipefail
          echo "$ID_PARTITA" | grep -qE '^[0-9]{1,9}$' || { echo "::error::«id_partita» dev'essere un numero"; exit 1; }

      - name: Prepara SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Leggi la ficha, dalla VM
        run: |
          set -euo pipefail
          # 🚨 Gli input passano come ARGOMENTI, non interpolati nel testo dello script remoto.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' -- "$DEPLOY_PATH" "$ID_PARTITA" <<'REMOTO'
          set -uo pipefail
          CARTELLA="$1"; ID="$2"
          cd "$CARTELLA" || { echo "::error::cartella $CARTELLA assente"; exit 1; }

          # ⛔ Le credenziali NON si stampano MAI: si estraggono riga per riga (stessa forma
          #    della sonda del tabellone) e si passano al nodo per ambiente. Un `source` del
          #    .env intero sarebbe più corto ma esegue quel file: qui si legge, non si esegue.
          leggi () { grep -m1 "^$1=" ./.env 2>/dev/null | cut -d= -f2- | tr -d '"'"'"'\r'; }
          MP_BASE="$(leggi MATCHPOINT_BASE_URL)"
          # 🩹 `MATCHPOINT_BASE_URL` NON sta nel .env e non sta in pm2 — misurato al giro #2,
          #    ed è normale: il worker ce l'ha come DEFAULT nel codice (`DEFAULT_BASE_URL`,
          #    server.mjs riga 18) e nessuno ha mai avuto bisogno di scriverlo. Chiederlo come
          #    obbligatorio faceva fallire la sonda su una cosa che non manca.
          MP_BASE_DEFAULT='https://app-padelvillage-it.matchpoint.com.es'
          MP_USER="$(leggi MATCHPOINT_USERNAME)"
          MP_PASS="$(leggi MATCHPOINT_PASSWORD)"

          # 🩹⭐ IL `.env` NON BASTA, misurato al primo giro (run #1, 01/09 21:13): quelle tre
          #    variabili lì dentro non ci sono. La sonda del tabellone trovava la sua chiave
          #    perché QUELLA c'è — e da quel successo ne avevo dedotto un altro. La fonte di
          #    ciò che il processo ha davvero in mano è **pm2**, non un file.
          # ⛔ E non si stampa: si estrae in una variabile e basta. `pm2 jlist` porta l'env
          #    completo del worker — la stessa ragione per cui `stato-worker.yml` filtra a
          #    lista bianca invece di stampare `pm2 describe`.
          if [ -z "$MP_USER" ] || [ -z "$MP_PASS" ] || [ -z "$MP_BASE" ]; then
            JL="$(mktemp)"
            pm2 jlist > "$JL" 2>/dev/null || true
            daPm2 () { python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(next((((p.get('pm2_env') or {}).get(sys.argv[2]) or '') for p in d if p.get('name')=='matchpoint-worker'),''),end='')" "$JL" "$1" 2>/dev/null; }
            [ -n "$MP_BASE" ] || MP_BASE="$(daPm2 MATCHPOINT_BASE_URL)"
            [ -n "$MP_USER" ] || MP_USER="$(daPm2 MATCHPOINT_USERNAME)"
            [ -n "$MP_PASS" ] || MP_PASS="$(daPm2 MATCHPOINT_PASSWORD)"
            rm -f "$JL"
          fi

          # ⇒ L'indirizzo ripiega sul default del worker; utente e password no: quelle o ci
          #    sono o la sonda non ha niente con cui entrare.
          [ -n "$MP_BASE" ] || MP_BASE="$MP_BASE_DEFAULT"

          if [ -z "$MP_USER" ] || [ -z "$MP_PASS" ]; then
            # ⭐ Il referto dice QUALI mancano — mai i valori — e i NOMI delle chiavi che il
            #    .env ha davvero: senza, «non trovate» è un muro e la caccia riparte da zero.
            echo "::error::utente/password Matchpoint non trovati (ne' in $CARTELLA/.env ne' in pm2)."
            echo "  utente=$([ -n "$MP_USER" ] && echo si || echo NO) password=$([ -n "$MP_PASS" ] && echo si || echo NO)"
            echo "  chiavi presenti nel .env (solo i NOMI, mai i valori):"
            cut -d= -f1 ./.env 2>/dev/null | grep -E '^[A-Z]' | sed 's/^/    /' || echo "    (.env assente o illeggibile)"
            echo "  nomi di processo noti a pm2:"
            pm2 jlist 2>/dev/null | python3 -c "import json,sys;print('    '+', '.join(p.get('name','?') for p in json.load(sys.stdin)))" 2>/dev/null || echo "    (pm2 non risponde)"
            exit 1
          fi

          SCRIPT="$(mktemp --suffix=.mjs "$CARTELLA/sonda-ficha-XXXXXX")"
          trap 'rm -f "$SCRIPT"' EXIT
          cat > "$SCRIPT" <<'NODE'
          import { chromium } from 'playwright';

          const base = (process.env.MATCHPOINT_BASE_URL || '').replace(/\/+$/, '');
          const id = process.env.ID;
          const taglia = (s, n) => (s && s.length > n ? s.slice(0, n) + ' …[troncato]' : (s || ''));

          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
          const ctx = await browser.newContext({ locale: 'it-IT', timezoneId: 'Europe/Rome', viewport: { width: 1440, height: 900 } });
          const page = await ctx.newPage();
          // Come `mpNewContextPage` nel worker: un confirm() nativo lasciato aperto blocca
          // la pagina, e questa sonda non deve mai restare appesa a un dialogo.
          page.on('dialog', (d) => d.accept().catch(() => {}));
          try {
            await page.goto(base + '/Login.aspx', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.locator('#username, input[name="username"]').first().fill(process.env.MATCHPOINT_USERNAME, { timeout: 20000 });
            await page.locator('#password, input[name="password"]').first().fill(process.env.MATCHPOINT_PASSWORD, { timeout: 20000 });
            await Promise.all([
              page.waitForLoadState('networkidle', { timeout: 45000 }).catch(() => {}),
              page.locator('#btnLogin, input[name="btnLogin"]').first().click({ timeout: 15000 }),
            ]);
            await page.waitForTimeout(2500);
            // 🩹⭐ IL CONTROLLO È QUELLO DEL WORKER, non uno più stretto — corretto al giro #3.
            //    La prima stesura bocciava sul solo URL: ma dopo il login Matchpoint può
            //    restare su un `Login.aspx?AspxAutoDetectCookieSupport=1` (il giro del cookie,
            //    visto anche da un curl anonimo) ⇒ «login non riuscito» detto a un login
            //    riuscito. `mpDoLogin` pretende DUE cose insieme: l'URL **e** un campo
            //    password ancora in pagina. Qui si copia quella, non una propria.
            const restaPassword = await page.locator('input[type="password"]').count().catch(() => 0);
            if (/Login\.aspx/i.test(page.url()) && restaPassword) {
              console.log('::error::login Matchpoint non riuscito (url=' + page.url() + ')');
              process.exit(1);
            }

            const url = base + '/Reservas/FichaPartidaPagoPorUsuario.aspx?modo=fancy&id=' + encodeURIComponent(id);
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(2500);

            const referto = await page.evaluate(() => {
              const out = { links: [], modali: [], sovrapposti: [], funzione: null, titolo: document.title };
              for (const a of document.querySelectorAll('a[id*="LinkButtonEliminar"]')) {
                out.links.push({ id: a.id, onclick: a.getAttribute('onclick'), href: (a.getAttribute('href') || '').slice(0, 90), testo: (a.innerText || '').trim() });
              }
              for (const d of document.querySelectorAll('[id^="mpModal"], [id*="Devolucion"], [id*="devolucion"]')) {
                const st = getComputedStyle(d);
                out.modali.push({ id: d.id, tag: d.tagName, display: st.display, visibility: st.visibility, zIndex: st.zIndex, html: d.outerHTML.slice(0, 2500) });
              }
              for (const s of document.querySelectorAll('.fancybox-wrap, .swal2-container, .modal.in, .modal.show')) {
                const st = getComputedStyle(s);
                if (st.display !== 'none') out.sovrapposti.push({ cls: s.className, display: st.display });
              }
              try {
                const f = window.confirmarEliminarParticipanteConDevolucion;
                if (typeof f === 'function') out.funzione = f.toString().slice(0, 3000);
              } catch (e) { out.funzione = 'errore: ' + e.message; }
              return out;
            });

            console.log('== FICHA ' + id + ' — ' + referto.titolo + ' ==');
            console.log('');
            console.log('-- link «Eliminare» presenti: ' + referto.links.length + ' --');
            for (const l of referto.links) {
              console.log('  ' + l.id);
              console.log('     testo   : ' + l.testo);
              console.log('     onclick : ' + (l.onclick === null ? '(NESSUNO)' : l.onclick));
              console.log('     href    : ' + l.href);
            }
            console.log('');
            console.log('-- elementi modale/devoluzione nel DOM: ' + referto.modali.length + ' --');
            for (const m of referto.modali) {
              console.log('  <' + m.tag.toLowerCase() + ' id="' + m.id + '"> display=' + m.display + ' visibility=' + m.visibility + ' z=' + m.zIndex);
              console.log('  ' + taglia(m.html, 2500));
              console.log('');
            }
            console.log('-- sovrapposizioni GIÀ aperte adesso: ' + referto.sovrapposti.length + ' --');
            for (const s of referto.sovrapposti) console.log('  ' + s.cls + ' (' + s.display + ')');
            console.log('');
            console.log('-- confirmarEliminarParticipanteConDevolucion --');
            console.log(referto.funzione || '  (non definita su window)');
          } finally {
            await browser.close().catch(() => {});
          }
          NODE

          # 🩹⭐⭐ L'ESITO SI PROPAGA, e al giro #3 non si propagava: lo script remoto gira
          #    con `set -uo pipefail` (senza `-e`), quindi il nodo è uscito 1 gridando
          #    «login non riuscito» e il workflow è risultato **verde**. È il difetto peggiore
          #    che una sonda possa avere — dice di aver guardato quando non ha guardato — ed
          #    è la stessa forma della «sonda che sbaglia una colonna» di ieri sera.
          ESITO=0
          ID="$ID" MATCHPOINT_BASE_URL="$MP_BASE" MATCHPOINT_USERNAME="$MP_USER" \
            MATCHPOINT_PASSWORD="$MP_PASS" /opt/node24/bin/node "$SCRIPT" || ESITO=$?
          echo
          if [ "$ESITO" -ne 0 ]; then
            echo "== la lettura NON è riuscita (uscita $ESITO). Nessun click, niente è stato toccato. =="
            exit "$ESITO"
          fi
          echo "== fine lettura. Nessun click, niente è stato toccato. =="
          REMOTO
