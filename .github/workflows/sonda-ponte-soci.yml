name: Sonda del ponte dei soci (SOLA LETTURA, solo sul gestionale nuovo)

# 🔎⭐⭐ PERCHÉ ESISTE — 08/09/2026, voci 177 e 179.
#
# Tutt'e due le voci sono in servizio su `cudi` e tutt'e due restano APERTE per la stessa
# ragione: «serve un gesto vero del bot di prova». E il gesto non si poteva fare, perché
# chiamare il ponte vuole `CONSUMER_BRIDGE_SECRET`, che non sta nell'ambiente della sessione.
# 📌 *Un limite dichiarato che nessuno riprova resta vero per sempre, perché sembra prudente.*
#
# ⭐ Il segreto però sta sulla VM, nel `.env` del bot di PROVA — quello che punta al gestionale
# nuovo. E su quella VM ci si arriva da Actions. ⇒ La prova viva si può fare.
#
# ⛔ COSA QUESTO ATTREZZO NON PUÒ FARE, ed è cablato — non è una guardia che si può sbagliare,
#    sono valori che nel file non ci sono:
#   · l'indirizzo è **solo** quello di `cudi`. Il ref di PROD non compare qui dentro;
#   · l'azione è **solo** `verifica`, che è l'unica del ponte che non scrive niente e non
#     chiama il worker («Non scrive NIENTE… è la sua ragione d'essere», `index.ts`);
#   · il segreto si legge **solo** dal bot di PROVA. Anche prendendo per sbaglio quello del bot
#     dei soci, la chiamata verso `cudi` uscirebbe **401**: sbagliare qui non fa danno, fa un no.
# ⇒ Non manda messaggi a nessuno, non prenota, non annulla, non tocca Matchpoint.

on:
  workflow_dispatch:
    inputs:
      member_id:
        description: 'Codice socio a 6 cifre (una delle cinque persone di segreteria)'
        required: true
        default: '001013'
      data:
        description: 'Giorno dello slot, YYYY-MM-DD'
        required: true
      ora:
        description: 'Ora dello slot, HH:MM'
        required: true
        default: '09:00'
      campo:
        description: 'Numero del campo'
        required: true
        default: '4'
      scritta_alle:
        description: 'Istante della scrittura (ISO). Vuoto = non lo diciamo, e non uscirà mai un «no»'
        required: false
        default: ''

jobs:
  sonda:
    runs-on: ubuntu-latest
    env:
      # 🔒 Solo il gestionale nuovo. Cablato, non un input.
      URL_NUOVO: https://cudiqnrrlbyqryrtaprd.supabase.co/functions/v1/consumer-booking-write
      DEPLOY_HOST: ${{ vars.HETZNER_WORKER_HOST || '91.99.131.243' }}
      DEPLOY_USER: ${{ vars.HETZNER_WORKER_USER || 'root' }}
    steps:
      - name: Prepara SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🔑 Il segreto del ponte — prima il secret del repo, poi la VM
        env:
          DAL_REPO: ${{ secrets.CONSUMER_BRIDGE_SECRET_TEST }}
        run: |
          set -euo pipefail
          # 🔑⭐⭐ LA STRADA CORTA, aggiunta l'08/09 sera. 📏 Misurato: sulla VM quel valore NON
          #    c'è — il bot di prova non lo porta (pm2: 72 chiavi, nessuna di segreto;
          #    `/proc/<pid>/environ` leggibile e senza; nella sua cartella solo `.env.example`).
          #    Sta sul Mac del committente, e dal cloud il Mac non si raggiunge.
          # ⇒ La casella giusta è un SECRET DEL REPO: lo vede solo chi lancia il workflow, esce
          #    mascherato nei log, e non entra mai in git. ⛔ La strada sbagliata sarebbe la chat:
          #    una password incollata lì è già bruciata e va cambiata.
          # ⚖️ Se la casella è vuota non si fallisce: si prova la VM come prima. La strada corta
          #    si AGGIUNGE, non sostituisce — e in tutti i casi si DICHIARA quale ha risposto.
          if [ -n "${DAL_REPO:-}" ]; then
            echo "::add-mask::$DAL_REPO"
            printf '%s' "$DAL_REPO" > /tmp/seg
            echo "strada: secret del repo (CONSUMER_BRIDGE_SECRET_TEST)"
            echo "lunghezza ${#DAL_REPO} · sha $(printf '%s' "$DAL_REPO" | sha256sum | cut -c1-8)"
            exit 0
          fi
          echo "  · la casella CONSUMER_BRIDGE_SECRET_TEST è vuota: provo la VM"

          # 🩹⭐⭐ TRE FONTI E DUE GIRI, e la forma non è un vezzo — è la lezione ⑤ del
          #    passaggio di consegne: *il posto giusto dove interpretare un dato è quello dove
          #    non serve annidare una terza sintassi.* Python dentro ssh dentro YAML non è un
          #    file valido, quindi di là si RACCOGLIE e di qua si INTERPRETA.
          # 🩹 E i due giri precedenti hanno sbagliato per lo stesso motivo, due volte:
          #    · giro 1 guardava UNA cartella e diceva `env_assente`;
          #    · giro 2 cercava il processo con `pgrep -f assistente-telegram-prova`, cioè il
          #      nome PM2 dentro la riga di comando, dove non c'è — e i `2>/dev/null`
          #      zittivano l'unica cosa che l'avrebbe detto.
          #    📌 *Un errore silenziato ha la stessa faccia di un valore assente.*

          # ── giro 1: si raccoglie ciò che pm2 sa, senza interpretarlo di là ──
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            'export PATH="/opt/node24/bin:/usr/local/bin:/usr/bin:/bin:$PATH"; pm2 jlist' \
            > /tmp/pm2.json 2>/tmp/pm2.err || echo "pm2 è uscito male: $(head -c 200 /tmp/pm2.err)"

          cat > /tmp/leggi.py <<'PY'
          import json, sys
          NOME = 'assistente-telegram-prova'
          CHIAVE, CHIAVE_FILE = 'CONSUMER_BRIDGE_SECRET', 'CONSUMER_BRIDGE_SECRET_FILE'
          try:
              d = json.load(open('/tmp/pm2.json'))
          except Exception as e:
              print('NOTA=pm2 non ha risposto JSON (%s)' % type(e).__name__); raise SystemExit
          p = next((x for x in d if x.get('name') == NOME), None)
          if p is None:
              print('NOTA=processo %s assente; pm2 vede: %s' % (NOME, ', '.join(str(x.get('name')) for x in d)))
              raise SystemExit
          e = p.get('pm2_env') or {}
          print('PID=%s' % (p.get('pid') or ''))
          print('CWD=%s' % (e.get('pm_cwd') or ''))
          # ⛔ solo i NOMI delle chiavi che somigliano a un segreto, mai i valori
          print('NOTA=pm2_env ha %d chiavi; quelle di segreto: %s'
                % (len(e), ','.join(k for k in e if 'SECRET' in k or 'BRIDGE' in k) or 'nessuna'))
          print('SEGRETO=%s' % (e.get(CHIAVE) or ''))
          print('DAFILE=%s' % (e.get(CHIAVE_FILE) or ''))
          PY
          python3 /tmp/leggi.py > /tmp/letto.txt
          grep -E '^NOTA=' /tmp/letto.txt | sed 's/^NOTA=/  · /' || true
          campo () { grep -m1 "^$1=" /tmp/letto.txt | cut -d= -f2- || true; }
          SEG="$(campo SEGRETO)"; DAFILE="$(campo DAFILE)"; PID="$(campo PID)"; CWD="$(campo CWD)"
          STRADA=""
          [ -n "$SEG" ] && STRADA="pm2"

          # ── giro 2: solo se serve, si va a prendere il valore dove pm2 ha detto ──
          if [ -z "$SEG" ]; then
            # ⭐ I posti si costruiscono da ciò che pm2 ha detto (il suo `pm_cwd` e il suo PID),
            #    non da una cartella indovinata: è la correzione del giro 2.
            POSTI="$DAFILE|${CWD:+$CWD/.env}|${PID:+/proc/$PID/environ}|/opt/assistente-padel-agent-prova/.env"
            SEG="$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
              "POSTI='$POSTI' bash -s" <<'REMOTO'
            IFS='|' read -ra P <<< "$POSTI"
            for f in "${P[@]}"; do
              [ -n "$f" ] && [ -r "$f" ] || continue
              case "$f" in
                */environ) V="$(tr '\0' '\n' < "$f" | grep -m1 '^CONSUMER_BRIDGE_SECRET=' | cut -d= -f2-)" ;;
                *.env)     V="$(grep -m1 '^CONSUMER_BRIDGE_SECRET=' "$f" | cut -d= -f2- | tr -d "\"'" )" ;;
                *)         V="$(head -c 4096 "$f" | tr -d '\r\n')" ;;
              esac
              if [ -n "$V" ]; then echo "TROVATO:$f:$V"; exit 0; fi
            done
            echo "NIENTE"
            echo "── dove ho guardato (solo nomi) ──" >&2
            for f in "${P[@]}"; do
              [ -n "$f" ] || continue
              if [ -r "$f" ]; then echo "  leggibile, ma senza la chiave: $f" >&2; else echo "  non leggibile: $f" >&2; fi
            done
            ls -1a /opt/assistente-padel-agent-prova 2>&1 | head -20 | sed 's/^/  contenuto: /' >&2
          REMOTO
            )"
            case "$SEG" in
              TROVATO:*) STRADA="$(echo "$SEG" | cut -d: -f2)"; SEG="$(echo "$SEG" | cut -d: -f3-)" ;;
              *) SEG="" ;;
            esac
          fi

          [ -n "$SEG" ] && echo "::add-mask::$SEG"
          echo "strada: ${STRADA:-nessuna}"
          if [ -z "$SEG" ]; then
            echo "::error::Il segreto del ponte non si è trovato sulla VM. Non invento una chiamata che non posso fare — sopra c'è l'elenco di dove ho guardato."
            exit 1
          fi
          printf '%s' "$SEG" > /tmp/seg
          echo "lunghezza ${#SEG} · sha $(printf '%s' "$SEG" | sha256sum | cut -c1-8)"

      - name: 🔎 CHIAMA `verifica` — non scrive niente
        env:
          MEMBER_ID: ${{ inputs.member_id }}
          DATA: ${{ inputs.data }}
          ORA: ${{ inputs.ora }}
          CAMPO: ${{ inputs.campo }}
          SCRITTA: ${{ inputs.scritta_alle }}
        run: |
          set -euo pipefail
          CORPO="$(python3 -c '
          import json, os
          b = {"action": "verifica", "member_id": os.environ["MEMBER_ID"],
               "data": os.environ["DATA"], "ora": os.environ["ORA"],
               "campo": int(os.environ["CAMPO"])}
          s = os.environ.get("SCRITTA", "").strip()
          if s: b["scritta_alle"] = s
          print(json.dumps(b))')"
          echo "richiesta: $CORPO"
          CODICE="$(curl -sS -o /tmp/risposta.json -w '%{http_code}' \
            -X POST "$URL_NUOVO" \
            -H 'Content-Type: application/json' \
            -H "X-Consumer-Secret: $(cat /tmp/seg)" \
            -d "$CORPO")"
          echo "── HTTP $CODICE ──"
          python3 -m json.tool /tmp/risposta.json || cat /tmp/risposta.json
          # 🚨 Un 401 non è un guasto della sonda: è il segreto sbagliato, e va detto per nome
          # invece di lasciarlo dedurre da un JSON.
          [ "$CODICE" = "401" ] && echo "::error::401 — il segreto letto non è quello del gestionale nuovo."
          [ "$CODICE" = "200" ] || exit 1
          echo "::notice::Il ponte ha risposto. Il verdetto è nel JSON qui sopra."
