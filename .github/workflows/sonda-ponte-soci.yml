name: Sonda del ponte dei soci (SOLA LETTURA, solo sul gestionale nuovo)

# 🔎⭐⭐ PERCHÉ ESISTE — 08/09/2026, voci 177 e 179.
#
# Tutt'e due le voci sono in servizio su `cudi` e tutt'e due restano APERTE per la stessa
# ragione: «serve un gesto vero del bot di prova». E il gesto non si poteva fare, perché
# chiamare il ponte vuole `CONSUMER_BRIDGE_SECRET`, che non sta nell'ambiente della sessione.
# 📌 *Un limite dichiarato che nessuno riprova resta vero per sempre, perché sembra prudente.*
#
# ⭐ Il segreto però sta sulla VM, nel `.env` del bot di PROVA — quello che punta al gestionale
# nuovo. E su quella VM ci si arriva da Actions. ⇒ La prova viva si può fare.
#
# ⛔ COSA QUESTO ATTREZZO NON PUÒ FARE, ed è cablato — non è una guardia che si può sbagliare,
#    sono valori che nel file non ci sono:
#   · l'indirizzo è **solo** quello di `cudi`. Il ref di PROD non compare qui dentro;
#   · l'azione è **solo** `verifica`, che è l'unica del ponte che non scrive niente e non
#     chiama il worker («Non scrive NIENTE… è la sua ragione d'essere», `index.ts`);
#   · il segreto si legge **solo** dal bot di PROVA. Anche prendendo per sbaglio quello del bot
#     dei soci, la chiamata verso `cudi` uscirebbe **401**: sbagliare qui non fa danno, fa un no.
# ⇒ Non manda messaggi a nessuno, non prenota, non annulla, non tocca Matchpoint.

on:
  workflow_dispatch:
    inputs:
      member_id:
        description: 'Codice socio a 6 cifre (una delle cinque persone di segreteria)'
        required: true
        default: '001013'
      data:
        description: 'Giorno dello slot, YYYY-MM-DD'
        required: true
      ora:
        description: 'Ora dello slot, HH:MM'
        required: true
        default: '09:00'
      campo:
        description: 'Numero del campo'
        required: true
        default: '4'
      scritta_alle:
        description: 'Istante della scrittura (ISO). Vuoto = non lo diciamo, e non uscirà mai un «no»'
        required: false
        default: ''

jobs:
  sonda:
    runs-on: ubuntu-latest
    env:
      # 🔒 Solo il gestionale nuovo. Cablato, non un input.
      URL_NUOVO: https://cudiqnrrlbyqryrtaprd.supabase.co/functions/v1/consumer-booking-write
      DEPLOY_HOST: ${{ vars.HETZNER_WORKER_HOST || '91.99.131.243' }}
      DEPLOY_USER: ${{ vars.HETZNER_WORKER_USER || 'root' }}
    steps:
      - name: Prepara SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🔑 Il segreto del ponte, dal bot di PROVA
        run: |
          set -euo pipefail
          # 🩹⭐ PIÙ FONTI, non una — la lezione pagata due volte oggi sull'attrezzo dei secret.
          #    Il primo giro (run 1) ha dato `env_assente`: guardava SOLO
          #    `/opt/assistente-padel-agent-prova/.env`. «Non sta lì» non è «non c'è sulla VM».
          #    📌 *Una sonda che interroga UNA fonte risponde su quella fonte, non sul fatto.*
          # ⇒ Si prova per gradi e si DICHIARA quale strada ha risposto. E quando nessuna
          #    risponde, si stampa DOVE si è guardato — solo NOMI di file, mai contenuti.
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s > /tmp/segreto.txt <<'REMOTO' || true
            export PATH="/opt/node24/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            NOME=assistente-telegram-prova

            dai_env () {  # $1 = file .env
              [ -r "$1" ] || return 1
              V="$(grep -m1 '^CONSUMER_BRIDGE_SECRET=' "$1" | cut -d= -f2- | tr -d "\"'" )"
              if [ -n "$V" ]; then echo "STRADA=env:$1"; echo "SEGRETO=$V"; return 0; fi
              F="$(grep -m1 '^CONSUMER_BRIDGE_SECRET_FILE=' "$1" | cut -d= -f2- | tr -d "\"'" )"
              if [ -n "$F" ] && [ -r "$F" ]; then
                echo "STRADA=file-da-env:$F"; echo "SEGRETO=$(head -c 4096 "$F" | tr -d '\r\n')"; return 0
              fi
              return 1
            }

            # ① i .env plausibili del bot di prova
            for f in /opt/assistente-padel-agent-prova/.env \
                     /opt/assistente-padel-agent-prova/_prove/.env \
                     /opt/assistente-telegram-prova/.env; do
              dai_env "$f" && exit 0
            done

            # ② l'ambiente che pm2 ha dato AL PROCESSO del bot di prova
            if command -v pm2 >/dev/null 2>&1; then
              V="$(pm2 jlist 2>/dev/null | python3 -c "
            import json,sys
            try: d=json.load(sys.stdin)
            except Exception: d=[]
            e=next(((p.get('pm2_env') or {}) for p in d if p.get('name')=='$NOME'), {})
            print(e.get('CONSUMER_BRIDGE_SECRET') or '')
            " 2>/dev/null)"
              if [ -n "$V" ]; then echo "STRADA=pm2"; echo "SEGRETO=$V"; exit 0; fi
            fi

            # ③ la fonte che non mente: l'ambiente del PROCESSO VIVO
            PID="$(pgrep -f "$NOME" | head -1)"
            if [ -n "$PID" ] && [ -r "/proc/$PID/environ" ]; then
              V="$(tr '\0' '\n' < "/proc/$PID/environ" | grep -m1 '^CONSUMER_BRIDGE_SECRET=' | cut -d= -f2-)"
              if [ -n "$V" ]; then echo "STRADA=proc:$PID"; echo "SEGRETO=$V"; exit 0; fi
              F="$(tr '\0' '\n' < "/proc/$PID/environ" | grep -m1 '^CONSUMER_BRIDGE_SECRET_FILE=' | cut -d= -f2-)"
              if [ -n "$F" ] && [ -r "$F" ]; then
                echo "STRADA=file-da-proc:$F"; echo "SEGRETO=$(head -c 4096 "$F" | tr -d '\r\n')"; exit 0
              fi
            fi

            # ⛔ Nessuna strada. Si dice DOVE si è guardato: solo nomi, mai contenuti.
            echo "STRADA=non_trovato"
            echo "DOVE: cartelle sotto /opt —"; ls -1 /opt 2>/dev/null | sed 's/^/  /'
            echo "DOVE: file .env* nelle cartelle del bot —"
            ls -1 /opt/assistente-padel-agent-prova/.env* /opt/assistente-padel-agent/.env* 2>/dev/null | sed 's/^/  /' || echo "  (nessuno)"
            echo "DOVE: processi che somigliano al bot di prova —"; pgrep -af "$NOME" 2>/dev/null | sed 's/^/  /' || echo "  (nessuno)"
          REMOTO
          STRADA="$(grep -m1 '^STRADA=' /tmp/segreto.txt | cut -d= -f2- || true)"
          SEG="$(grep -m1 '^SEGRETO=' /tmp/segreto.txt | cut -d= -f2- || true)"
          [ -n "$SEG" ] && echo "::add-mask::$SEG"
          echo "strada: ${STRADA:-nessuna risposta}"
          if [ -z "$SEG" ]; then
            echo "── dove ho guardato ──"
            sed -n '/^DOVE/,$p' /tmp/segreto.txt || true
            echo "::error::Il segreto del ponte non si è trovato sulla VM. Non invento una chiamata che non posso fare."
            exit 1
          fi
          printf '%s' "$SEG" > /tmp/seg
          echo "lunghezza ${#SEG} · sha $(printf '%s' "$SEG" | sha256sum | cut -c1-8)"

      - name: 🔎 CHIAMA `verifica` — non scrive niente
        env:
          MEMBER_ID: ${{ inputs.member_id }}
          DATA: ${{ inputs.data }}
          ORA: ${{ inputs.ora }}
          CAMPO: ${{ inputs.campo }}
          SCRITTA: ${{ inputs.scritta_alle }}
        run: |
          set -euo pipefail
          CORPO="$(python3 -c '
          import json, os
          b = {"action": "verifica", "member_id": os.environ["MEMBER_ID"],
               "data": os.environ["DATA"], "ora": os.environ["ORA"],
               "campo": int(os.environ["CAMPO"])}
          s = os.environ.get("SCRITTA", "").strip()
          if s: b["scritta_alle"] = s
          print(json.dumps(b))')"
          echo "richiesta: $CORPO"
          CODICE="$(curl -sS -o /tmp/risposta.json -w '%{http_code}' \
            -X POST "$URL_NUOVO" \
            -H 'Content-Type: application/json' \
            -H "X-Consumer-Secret: $(cat /tmp/seg)" \
            -d "$CORPO")"
          echo "── HTTP $CODICE ──"
          python3 -m json.tool /tmp/risposta.json || cat /tmp/risposta.json
          # 🚨 Un 401 non è un guasto della sonda: è il segreto sbagliato, e va detto per nome
          # invece di lasciarlo dedurre da un JSON.
          [ "$CODICE" = "401" ] && echo "::error::401 — il segreto letto non è quello del gestionale nuovo."
          [ "$CODICE" = "200" ] || exit 1
          echo "::notice::Il ponte ha risposto. Il verdetto è nel JSON qui sopra."
