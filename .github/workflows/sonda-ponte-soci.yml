name: Sonda del ponte dei soci (SOLA LETTURA, solo sul gestionale nuovo)

# 🔎⭐⭐ PERCHÉ ESISTE — 08/09/2026, voci 177 e 179.
#
# Tutt'e due le voci sono in servizio su `cudi` e tutt'e due restano APERTE per la stessa
# ragione: «serve un gesto vero del bot di prova». E il gesto non si poteva fare, perché
# chiamare il ponte vuole `CONSUMER_BRIDGE_SECRET`, che non sta nell'ambiente della sessione.
# 📌 *Un limite dichiarato che nessuno riprova resta vero per sempre, perché sembra prudente.*
#
# ⭐ Il segreto però sta sulla VM, nel `.env` del bot di PROVA — quello che punta al gestionale
# nuovo. E su quella VM ci si arriva da Actions. ⇒ La prova viva si può fare.
#
# ⛔ COSA QUESTO ATTREZZO NON PUÒ FARE, ed è cablato — non è una guardia che si può sbagliare,
#    sono valori che nel file non ci sono:
#   · gli indirizzi sono **solo** quelli di `cudi`. Il ref di PROD non compare qui dentro;
#   · il segreto si legge **solo** dal bot di PROVA (o dal secret del repo). Anche prendendo per
#     sbaglio quello del bot dei soci, la chiamata verso `cudi` uscirebbe **401**: sbagliare qui
#     non fa danno, fa un no.
# ⇒ Non manda messaggi a nessuno e non tocca Matchpoint.
#
# 🔄🚨⭐ ESTESA IL 09/09/2026 — e la riga vecchia («l'azione è **solo** `verifica`») è stata
#    CORRETTA, non affiancata: adesso le azioni sono cinque, e lasciare in testa una promessa
#    più stretta di quello che il file fa sarebbe la peggiore delle note — *una nota sulla UI è
#    un'affermazione sul codice*, e questa sta sul codice stesso.
#
# 📏 LE CINQUE AZIONI, e la colonna che conta è l'ultima:
#
#   | azione          | dove va                    | scrive? |
#   |-----------------|----------------------------|---------|
#   | `verifica`      | consumer-booking-write     | ⛔ no — non chiama nemmeno il worker |
#   | `availability_day` | consumer-booking-write  | ⛔ no — è una lettura della griglia (voci 177 · 185) |
#   | `kb`            | consumer-player-readmodel  | ⛔ no — è ciò che il bot RACCONTA sugli orari (voce 177) |
#   | `create_prova`  | consumer-booking-write     | ⛔ no — `dry_run: true`, si ferma sulla riga prima di occupare il campo |
#   | `eventi_staff`  | consumer-staff-events      | ⛔ no — `dry_run: true`: guarda la coda senza chiuderla (voce 194 ②) |
#   | `create_vero`   | consumer-booking-write     | 🚨 **SÌ** — nasce una prenotazione vera. Vuole la parola `PRENOTO` |
#
# 🚨⭐⭐ E SU `eventi_staff` IL `dry_run` NON È UNA COMODITÀ, È L'UNICO MODO DI GUARDARE.
#    Ogni fatto si ritira **una volta sola**: il gestionale lo marca consegnato nel momento in
#    cui risponde. ⇒ Una chiamata senza `dry_run` da qui **brucerebbe** la coda — i fatti
#    risulterebbero consegnati e nessun bot li direbbe mai a nessuno.
#    📏 Verificato nel codice prima di aggiungere l'azione: `if (!dryRun && daChiudere.length)`
#    e `if (!dryRun && coperti.length)` sono le due sole righe che chiudono, e `dry_run` le
#    salta tutt'e due. ⇒ La sonda passa `dry_run: true` sempre, e non c'è modo di toglierlo
#    dalla casella: non è un'opzione, è parte dell'azione.
#
# ⭐⭐ PERCHÉ `create_prova` VALE QUANTO UN `create` VERO, per quello che deve dimostrare.
#    Il verdetto della griglia (voce 183) sta a `index.ts:591`, cioè nel blocco comune PRIMA
#    del ramo dell'azione; la prova a vuoto si ferma a `index.ts:912`. ⇒ Fra i due c'è tutto
#    quello che la 183 deve provare — i cinque rifiuti E il ramo `ok` con la durata presa
#    dalla FASCIA — e la riga che occupa il campo sta **dopo**.
#    📌 *Una prova a vuoto che si ferma troppo presto prova un percorso diverso da quello vero;
#    questa si ferma sull'ultima riga utile, ed è per questo che conta.*
#
# ⚖️ E UN RIFIUTO NON È UN GUASTO DELLA SONDA. `create_prova` su un orario fuori griglia esce
#    **400**, ed è l'esito giusto: nessuno ha scritto niente, e il codice lo dice a chiare
#    lettere («sono rifiuti puliti, non esiti ignoti»). ⇒ Qui il 400 si stampa e si dichiara,
#    non fa cadere il job — cadere direbbe «la sonda è rotta» dove il sistema ha risposto bene.

on:
  workflow_dispatch:
    inputs:
      azione:
        description: 'Cosa chiedere al ponte'
        required: true
        default: 'availability_day'
        type: choice
        options:
          - availability_day
          - kb
          - eventi_staff
          - create_prova
          - verifica
          - create_vero
      member_id:
        description: 'Codice socio a 6 cifre (una delle cinque persone di segreteria)'
        required: true
        default: '001013'
      data:
        description: 'Giorno dello slot, YYYY-MM-DD (non serve per `kb`)'
        required: false
        default: ''
      ora:
        description: 'Ora dello slot, HH:MM (solo per verifica/create_*)'
        required: false
        default: '18:00'
      campo:
        description: 'Numero del campo (solo per verifica/create_*)'
        required: false
        default: '4'
      durata:
        description: 'Durata in minuti. VUOTO = non la chiedo, e decide la fascia (voce 183)'
        required: false
        default: ''
      scritta_alle:
        description: 'Solo per `verifica`. Vuoto = non lo diciamo, e non uscirà mai un «no»'
        required: false
        default: ''
      conferma_scrittura:
        description: '🚨 Solo per `create_vero`: scrivere PRENOTO. Qualunque altra cosa ferma il job'
        required: false
        default: ''

jobs:
  sonda:
    runs-on: ubuntu-latest
    env:
      # 🔒 Solo il gestionale nuovo. Cablato, non un input.
      URL_NUOVO: https://cudiqnrrlbyqryrtaprd.supabase.co/functions/v1/consumer-booking-write
      # 🔒 Anche questo solo sul gestionale nuovo: è il lettore che dice cosa il bot RACCONTA.
      URL_READMODEL: https://cudiqnrrlbyqryrtaprd.supabase.co/functions/v1/consumer-player-readmodel
      # 🆕 VOCE 194 ② — la terza porta: quella da cui il bot ritira i fatti della segreteria.
      URL_EVENTI: https://cudiqnrrlbyqryrtaprd.supabase.co/functions/v1/consumer-staff-events
      DEPLOY_HOST: ${{ vars.HETZNER_WORKER_HOST || '91.99.131.243' }}
      DEPLOY_USER: ${{ vars.HETZNER_WORKER_USER || 'root' }}
    steps:
      - name: Prepara SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🔑 Il segreto del ponte — prima il secret del repo, poi la VM
        env:
          DAL_REPO: ${{ secrets.CONSUMER_BRIDGE_SECRET_TEST }}
        run: |
          set -euo pipefail
          # 🔑⭐⭐ LA STRADA CORTA, aggiunta l'08/09 sera. 📏 Misurato: sulla VM quel valore NON
          #    c'è — il bot di prova non lo porta (pm2: 72 chiavi, nessuna di segreto;
          #    `/proc/<pid>/environ` leggibile e senza; nella sua cartella solo `.env.example`).
          #    Sta sul Mac del committente, e dal cloud il Mac non si raggiunge.
          # ⇒ La casella giusta è un SECRET DEL REPO: lo vede solo chi lancia il workflow, esce
          #    mascherato nei log, e non entra mai in git. ⛔ La strada sbagliata sarebbe la chat:
          #    una password incollata lì è già bruciata e va cambiata.
          # ⚖️ Se la casella è vuota non si fallisce: si prova la VM come prima. La strada corta
          #    si AGGIUNGE, non sostituisce — e in tutti i casi si DICHIARA quale ha risposto.
          if [ -n "${DAL_REPO:-}" ]; then
            echo "::add-mask::$DAL_REPO"
            printf '%s' "$DAL_REPO" > /tmp/seg
            echo "strada: secret del repo (CONSUMER_BRIDGE_SECRET_TEST)"
            echo "lunghezza ${#DAL_REPO} · sha $(printf '%s' "$DAL_REPO" | sha256sum | cut -c1-8)"
            exit 0
          fi
          echo "  · la casella CONSUMER_BRIDGE_SECRET_TEST è vuota: provo la VM"

          # 🩹⭐⭐ TRE FONTI E DUE GIRI, e la forma non è un vezzo — è la lezione ⑤ del
          #    passaggio di consegne: *il posto giusto dove interpretare un dato è quello dove
          #    non serve annidare una terza sintassi.* Python dentro ssh dentro YAML non è un
          #    file valido, quindi di là si RACCOGLIE e di qua si INTERPRETA.
          # 🩹 E i due giri precedenti hanno sbagliato per lo stesso motivo, due volte:
          #    · giro 1 guardava UNA cartella e diceva `env_assente`;
          #    · giro 2 cercava il processo con `pgrep -f assistente-telegram-prova`, cioè il
          #      nome PM2 dentro la riga di comando, dove non c'è — e i `2>/dev/null`
          #      zittivano l'unica cosa che l'avrebbe detto.
          #    📌 *Un errore silenziato ha la stessa faccia di un valore assente.*

          # ── giro 1: si raccoglie ciò che pm2 sa, senza interpretarlo di là ──
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            'export PATH="/opt/node24/bin:/usr/local/bin:/usr/bin:/bin:$PATH"; pm2 jlist' \
            > /tmp/pm2.json 2>/tmp/pm2.err || echo "pm2 è uscito male: $(head -c 200 /tmp/pm2.err)"

          cat > /tmp/leggi.py <<'PY'
          import json, sys
          NOME = 'assistente-telegram-prova'
          CHIAVE, CHIAVE_FILE = 'CONSUMER_BRIDGE_SECRET', 'CONSUMER_BRIDGE_SECRET_FILE'
          try:
              d = json.load(open('/tmp/pm2.json'))
          except Exception as e:
              print('NOTA=pm2 non ha risposto JSON (%s)' % type(e).__name__); raise SystemExit
          p = next((x for x in d if x.get('name') == NOME), None)
          if p is None:
              print('NOTA=processo %s assente; pm2 vede: %s' % (NOME, ', '.join(str(x.get('name')) for x in d)))
              raise SystemExit
          e = p.get('pm2_env') or {}
          print('PID=%s' % (p.get('pid') or ''))
          print('CWD=%s' % (e.get('pm_cwd') or ''))
          # ⛔ solo i NOMI delle chiavi che somigliano a un segreto, mai i valori
          print('NOTA=pm2_env ha %d chiavi; quelle di segreto: %s'
                % (len(e), ','.join(k for k in e if 'SECRET' in k or 'BRIDGE' in k) or 'nessuna'))
          print('SEGRETO=%s' % (e.get(CHIAVE) or ''))
          print('DAFILE=%s' % (e.get(CHIAVE_FILE) or ''))
          PY
          python3 /tmp/leggi.py > /tmp/letto.txt
          grep -E '^NOTA=' /tmp/letto.txt | sed 's/^NOTA=/  · /' || true
          campo () { grep -m1 "^$1=" /tmp/letto.txt | cut -d= -f2- || true; }
          SEG="$(campo SEGRETO)"; DAFILE="$(campo DAFILE)"; PID="$(campo PID)"; CWD="$(campo CWD)"
          STRADA=""
          [ -n "$SEG" ] && STRADA="pm2"

          # ── giro 2: solo se serve, si va a prendere il valore dove pm2 ha detto ──
          if [ -z "$SEG" ]; then
            # ⭐ I posti si costruiscono da ciò che pm2 ha detto (il suo `pm_cwd` e il suo PID),
            #    non da una cartella indovinata: è la correzione del giro 2.
            POSTI="$DAFILE|${CWD:+$CWD/.env}|${PID:+/proc/$PID/environ}|/opt/assistente-padel-agent-prova/.env"
            SEG="$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
              "POSTI='$POSTI' bash -s" <<'REMOTO'
            IFS='|' read -ra P <<< "$POSTI"
            for f in "${P[@]}"; do
              [ -n "$f" ] && [ -r "$f" ] || continue
              case "$f" in
                */environ) V="$(tr '\0' '\n' < "$f" | grep -m1 '^CONSUMER_BRIDGE_SECRET=' | cut -d= -f2-)" ;;
                *.env)     V="$(grep -m1 '^CONSUMER_BRIDGE_SECRET=' "$f" | cut -d= -f2- | tr -d "\"'" )" ;;
                *)         V="$(head -c 4096 "$f" | tr -d '\r\n')" ;;
              esac
              if [ -n "$V" ]; then echo "TROVATO:$f:$V"; exit 0; fi
            done
            echo "NIENTE"
            echo "── dove ho guardato (solo nomi) ──" >&2
            for f in "${P[@]}"; do
              [ -n "$f" ] || continue
              if [ -r "$f" ]; then echo "  leggibile, ma senza la chiave: $f" >&2; else echo "  non leggibile: $f" >&2; fi
            done
            ls -1a /opt/assistente-padel-agent-prova 2>&1 | head -20 | sed 's/^/  contenuto: /' >&2
          REMOTO
            )"
            case "$SEG" in
              TROVATO:*) STRADA="$(echo "$SEG" | cut -d: -f2)"; SEG="$(echo "$SEG" | cut -d: -f3-)" ;;
              *) SEG="" ;;
            esac
          fi

          [ -n "$SEG" ] && echo "::add-mask::$SEG"
          echo "strada: ${STRADA:-nessuna}"
          if [ -z "$SEG" ]; then
            echo "::error::Il segreto del ponte non si è trovato sulla VM. Non invento una chiamata che non posso fare — sopra c'è l'elenco di dove ho guardato."
            exit 1
          fi
          printf '%s' "$SEG" > /tmp/seg
          echo "lunghezza ${#SEG} · sha $(printf '%s' "$SEG" | sha256sum | cut -c1-8)"

      - name: 🚦 Il cancello della scrittura — prima di comporre qualunque richiesta
        env:
          AZIONE: ${{ inputs.azione }}
          CONFERMA: ${{ inputs.conferma_scrittura }}
        run: |
          set -euo pipefail
          # 🚨⭐ STA PRIMA DELLA CHIAMATA, ed è il motivo per cui è un passo suo: un cancello
          # infilato dentro il passo che chiama si legge dopo che la richiesta è già composta,
          # e chi lo legge non distingue più «non ho scritto» da «non sono arrivato a scrivere».
          if [ "$AZIONE" != "create_vero" ]; then
            echo "azione «$AZIONE»: non scrive niente, si prosegue."
            exit 0
          fi
          if [ "${CONFERMA:-}" != "PRENOTO" ]; then
            echo "::error::create_vero fa NASCERE una prenotazione vera su cudi, che e' il sistema che diventa quello del circolo. Per farlo va scritto PRENOTO nella casella di conferma."
            exit 1
          fi
          echo "::warning::create_vero confermato: da qui esce una prenotazione VERA sul gestionale nuovo."

      - name: 🔎 Chiama il ponte
        env:
          AZIONE: ${{ inputs.azione }}
          MEMBER_ID: ${{ inputs.member_id }}
          DATA: ${{ inputs.data }}
          ORA: ${{ inputs.ora }}
          CAMPO: ${{ inputs.campo }}
          DURATA: ${{ inputs.durata }}
          SCRITTA: ${{ inputs.scritta_alle }}
        run: |
          set -euo pipefail
          # ⭐ Il corpo si compone in Python e non in bash: `durata` deve poter essere ASSENTE
          # (è il caso che la voce 183 chiama «chi non chiede una durata prende quella della
          # FASCIA»), e in bash «assente» e «vuoto» sono la stessa cosa — cioè proprio la
          # distinzione da cui dipende il caso da provare.
          COMPOSTO="$(python3 -c '
          import json, os, sys
          a = os.environ["AZIONE"]
          URL_W = os.environ["URL_NUOVO"]
          URL_R = os.environ["URL_READMODEL"]
          mid = os.environ["MEMBER_ID"].strip()
          def slot(b):
              b["data"] = os.environ["DATA"].strip()
              b["ora"] = os.environ["ORA"].strip()
              b["campo"] = int(os.environ["CAMPO"].strip() or 4)
              d = os.environ.get("DURATA", "").strip()
              if d:
                  b["durata"] = int(d)
              return b
          if a == "kb":
              url, body = URL_R, {"action": "kb"}
          elif a == "availability_day":
              url, body = URL_W, {"action": "availability_day", "member_id": mid,
                                  "data": os.environ["DATA"].strip()}
          elif a == "verifica":
              url = URL_W
              body = slot({"action": "verifica", "member_id": mid})
              s = os.environ.get("SCRITTA", "").strip()
              if s:
                  body["scritta_alle"] = s
          elif a == "eventi_staff":
              # ⛔ `dry_run` è cablato qui e non arriva da nessuna casella: senza, questa
              #    chiamata chiuderebbe la coda senza consegnare niente a nessuno.
              url, body = os.environ["URL_EVENTI"], {"dry_run": True}
          elif a in ("create_prova", "create_vero"):
              url = URL_W
              body = slot({"action": "create", "member_id": mid})
              if a == "create_prova":
                  body["dry_run"] = True
          else:
              print("azione sconosciuta: %s" % a, file=sys.stderr)
              raise SystemExit(1)
          print(json.dumps({"url": url, "body": body}))')"
          URL="$(printf '%s' "$COMPOSTO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')"
          CORPO="$(printf '%s' "$COMPOSTO" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["body"]))')"
          echo "verso : $URL"
          echo "corpo : $CORPO"
          CODICE="$(curl -sS -o /tmp/risposta.json -w '%{http_code}' \
            -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "X-Consumer-Secret: $(cat /tmp/seg)" \
            -d "$CORPO")"
          echo "── HTTP $CODICE ──"
          # 🩹 La coda può avere centinaia di fatti: stamparli tutti NASCONDE quello che si
          #    cerca. ⇒ Su `eventi_staff` si stampa un riassunto per gesto più le righe dello
          #    slot chiesto; su tutto il resto la risposta intera, come prima.
          if [ "$AZIONE" = "eventi_staff" ]; then
            DATA="$DATA" ORA="$ORA" CAMPO="$CAMPO" python3 -c '
          import json, os
          d = json.load(open("/tmp/risposta.json"))
          ev = d.get("eventi") or []
          print("fatti che il bot riceverebbe: %d · troncato: %s · non riconosciuti: %s"
                % (len(ev), d.get("troncato"), d.get("non_riconosciuti")))
          conteggio = {}
          for e in ev:
              conteggio[e.get("gesto")] = conteggio.get(e.get("gesto"), 0) + 1
          print("per gesto:", json.dumps(conteggio, ensure_ascii=False))
          dd, oo, cc = os.environ["DATA"].strip(), os.environ["ORA"].strip(), os.environ["CAMPO"].strip()
          voluti = [e for e in ev if (e.get("partita") or {}).get("data") == dd
                    and (e.get("partita") or {}).get("ora") == oo
                    and "".join(ch for ch in str((e.get("partita") or {}).get("campo","")) if ch.isdigit()) == cc]
          print("── lo slot chiesto (%s %s campo %s): %d ──" % (dd, oo, cc, len(voluti)))
          print(json.dumps(voluti, ensure_ascii=False, indent=2))' || cat /tmp/risposta.json
          else
            python3 -m json.tool /tmp/risposta.json || cat /tmp/risposta.json
          fi
          # 🚨 Un 401 non è un guasto della sonda: è il segreto sbagliato, e va detto per nome
          # invece di lasciarlo dedurre da un JSON.
          if [ "$CODICE" = "401" ]; then
            echo "::error::401 — il segreto letto non è quello del gestionale nuovo."
            exit 1
          fi
          # ⚖️ Il 400 su un `create` è un ESITO, non un guasto: è il rifiuto pulito della
          # griglia, e nessuno ha scritto niente. Farlo cadere direbbe «la sonda è rotta»
          # proprio dove il sistema ha risposto come doveva.
          case "$AZIONE:$CODICE" in
            create_prova:400|create_vero:400)
              echo "::notice::Rifiuto pulito (400): la griglia ha detto no e non è stato scritto niente." ;;
            *:200) : ;;
            *)
              echo "::error::HTTP $CODICE inatteso per l'azione $AZIONE."
              exit 1 ;;
          esac
          echo "::notice::Il ponte ha risposto. Il verdetto è nel JSON qui sopra."
